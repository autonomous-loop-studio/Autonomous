<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captcha drill</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8f3ff;
    --muted: #8da3b8;
    --edge: #223447;
    --panel: #0b121c;
    --cyan: #00e5ff;
    --green: #36f1a2;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(circle at 18% 12%, rgba(0, 229, 255, .14), transparent 34rem),
      radial-gradient(circle at 82% 88%, rgba(54, 241, 162, .09), transparent 30rem),
      #05090f;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: min(100%, 620px);
    padding: clamp(28px, 6vw, 56px);
    border: 1px solid var(--edge);
    border-radius: 20px;
    background: linear-gradient(145deg, rgba(17, 29, 43, .94), rgba(8, 14, 22, .96));
    box-shadow: 0 30px 90px rgba(0, 0, 0, .58);
  }
  .eyebrow {
    margin: 0 0 18px;
    color: var(--cyan);
    font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 7vw, 50px);
    line-height: 1.04;
    letter-spacing: -.04em;
  }
  .lede {
    max-width: 44ch;
    margin: 16px 0 28px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.55;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .tile {
    min-height: 72px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: #070c13;
    color: var(--ink);
    font-size: 34px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color .12s, background .12s, transform .06s;
  }
  .tile:hover { border-color: var(--cyan); }
  .tile.selected {
    border-color: var(--green);
    background: rgba(54, 241, 162, .12);
    box-shadow: 0 0 0 2px rgba(54, 241, 162, .35);
  }
  button.verify {
    min-height: 52px;
    margin-top: 6px;
    border: 0;
    border-radius: 10px;
    background: var(--cyan);
    color: #001017;
    cursor: pointer;
    font: 800 16px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .01em;
    width: 100%;
  }
  button.verify:hover { filter: brightness(1.08); }
  #captcha-result {
    min-height: 52px;
    margin: 24px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--edge);
    color: var(--green);
    font: 700 20px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .footnote {
    margin: 18px 0 0;
    color: #5f7488;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Loop Studio / local practice page</p>
  <h1>Captcha drill</h1>
  <p class="lede">Select all squares containing a bus 🚌, then click Verify. This page is served locally and never leaves the machine.</p>
  <div class="grid" id="grid"></div>
  <button class="verify" id="captcha-submit" type="button">Verify</button>
  <p id="captcha-result" role="status" aria-live="polite">Waiting for selections.</p>
  <p class="footnote">No network requests. Safe to replay.</p>
</main>
<script>
  const TILES = ['🚌','🚗','🌳','🚌','🏠','🚌','🚗','🌳','🚗'];
  const EXPECTED = [0, 3, 5];
  const grid = document.getElementById('grid');
  const selected = new Set();
  TILES.forEach((emoji, i) => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.id = 'tile-' + i;
    btn.type = 'button';
    btn.textContent = emoji;
    btn.addEventListener('click', () => {
      if (selected.has(i)) { selected.delete(i); btn.classList.remove('selected'); }
      else { selected.add(i); btn.classList.add('selected'); }
    });
    grid.appendChild(btn);
  });
  document.getElementById('captcha-submit').addEventListener('click', () => {
    const result = document.getElementById('captcha-result');
    const got = [...selected].sort((a,b)=>a-b);
    const ok = got.length === EXPECTED.length && got.every((v,i)=>v===EXPECTED[i]);
    if (ok) {
      result.textContent = 'Captcha solved: all bus squares selected.';
      result.style.color = '#36f1a2';
    } else {
      result.textContent = 'Wrong selection, try again.';
      result.style.color = '#ff6b6b';
    }
  });
</script>
</body>
</html>
