<html lang="en" data-build="512">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/svg+xml" href="ui/favicon.svg?v=512">
  <title>Router Studio // Multi-Agent Interface</title>
  <link rel="stylesheet" href="ui/css/base.css?v=512">
  <link rel="stylesheet" href="ui/css/layout.css?v=512">
  <link rel="stylesheet" href="ui/css/chat.css?v=512">
  <link rel="stylesheet" href="ui/css/topology.css?v=512">
  <link rel="stylesheet" href="ui/css/modals.css?v=512">
  <link rel="stylesheet" href="ui/css/components.css?v=512">
  <link rel="stylesheet" href="ui/css/codeblocks.css?v=512">

  <!-- Preload critical modules -->
  <link rel="modulepreload" href="ui/js/app.js?v=512">
  <link rel="modulepreload" href="ui/js/store.js?v=512">
  <link rel="modulepreload" href="ui/js/api.js?v=512">
  <link rel="modulepreload" href="ui/js/components/chat.js?v=512">
  <link rel="modulepreload" href="ui/js/components/sidebar.js?v=512">
  <link rel="modulepreload" href="ui/js/components/topology.js?v=512">
</head>
<body data-theme="dark">
  <!-- Loading screen (shown before any JS runs) -->
  <div id="app-loader" class="app-loader">
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-text">Loading Router Studio…</div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <button class="mobile-nav-btn" id="sidebarToggle" title="Setup"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
        <div class="logo-dot"></div>
        <div class="logo-text">
          <span class="logo-title">
            <span class="logo-name">ROUTER STUDIO</span>
            <span class="app-version" id="appVersion">v512</span>
          </span>
          <span class="app-credit">Made By: <a href="https://github.com/mbhudson/" target="_blank" rel="noopener noreferrer">MBHudson</a></span>
        </div>
      </div>
      <div class="header-info">
        <div class="header-stat">
          <span>Agents:</span>
          <span class="value" id="statAgents">0</span>
        </div>
        <div class="header-stat">
          <span>Providers:</span>
          <span class="value" id="statProviders">0</span>
        </div>
        <div class="header-stat">
          <span>Sessions:</span>
          <span class="value" id="statSessions">0</span>
        </div>
        <div class="header-stat">
          <span>Uptime:</span>
          <span class="value" id="statUptime">00:00:00</span>
        </div>
        <button class="header-toggle" id="terminalToggle" title="Toggle terminal panel">Terminal</button>
        <button class="header-toggle" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
        <button class="header-toggle" id="themeToggle" title="Toggle theme">&#9730;</button>
        <button class="mobile-nav-btn" id="panelToggle" title="Network"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5" stroke-dasharray="2 1.5"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="2.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="2.9" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="13.1" cy="11" r="1.2" fill="currentColor" stroke="none"/><path d="M8 6.4V3.7M6.9 8.9l-2.8 1.4M9.1 8.9l2.8 1.4"/></svg></button>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-tab="sessions">Sessions</button>
        <button class="nav-btn" data-tab="agents">Agents</button>
        <button class="nav-btn" data-tab="providers">Providers</button>
        <button class="nav-btn" data-tab="proxy">Proxy</button>
        <button class="nav-btn" data-tab="config">Config</button>
      </nav>
      <div class="sidebar-body" id="sidebarBody">
        <!-- Sidebar content rendered by JS -->
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main-panel">
      <button class="dialog-export-btn" id="dialogExportBtn" title="Export session">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 2v8M8 10L4.5 6.5M8 10l3.5-3.5M2.5 12.5h11"/>
        </svg>
      </button>
      <!-- Live training-drill progress. Training mode only; hidden otherwise. -->
      <div class="drill-strip" id="drillStrip" hidden>
        <span class="drill-strip-title">drill</span>
        <div class="drill-strip-rows" id="drillStripRows"></div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="empty" id="emptyState">
          <div class="empty-icon">&#9670;</div>
          <div>No messages yet. Start a conversation!</div>
        </div>
        <!-- Messages rendered by JS -->
      </div>
      <button class="clear-screen-btn" id="clearScreenBtn" title="Clear screen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2.5 8a5.5 5.5 0 1 1 1.6 3.9M2.5 8V4.5M2.5 8h3.5"/>
        </svg>
      </button>
      <div class="chat-input-area">
        <button class="mic-btn" id="micBtn" title="Speech to text">&#127908;</button>
        <div class="chat-input-wrapper">
          <textarea class="chat-input" id="inputField" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" title="Send message">&#9654;</button>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="right-panel" id="rightPanel">
      <div class="right-panel-header">
        <span>Topology</span>
        <div class="topology-notifications" id="topoNotifications">
          <button class="notif-bell" id="notifBell" aria-label="Notifications">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 2a4 4 0 0 1 4 4H4a4 4 0 0 1 4-4Z"/>
              <path d="M8 14v-2"/>
            </svg>
            <span class="notif-badge" id="notifBadge" hidden>0</span>
          </button>
        </div>
      </div>
      <div class="right-panel-body">
        <div class="topology-container" id="topologyContainer">
          <div class="topology-svg" id="topoSvg"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Notification dropdown (viewport-fixed, outside sliding panels) -->
  <div class="notif-dropdown" id="notifDropdown" hidden>
    <div class="notif-header">
      <span>Notifications</span>
      <button class="notif-clear" id="notifClear">Clear</button>
    </div>
    <div class="notif-list" id="notifList"></div>
  </div>

  <!-- Thinking panel overlay -->
  <div class="thinking-panel hidden" id="thinkingPanel">
    <div class="panel-header">
      <span>Thinking</span>
      <button class="panel-close" id="thinkingClose">&times;</button>
    </div>
    <div class="panel-body" id="thinkingContent"></div>
  </div>

  <!-- Terminal panel overlay -->
  <div class="terminal-panel hidden" id="terminalPanel">
    <div class="panel-header">
      <span>Terminal</span>
      <button class="panel-close" id="terminalClose">&times;</button>
    </div>
    <div class="panel-body" id="terminalContent"></div>
  </div>

  <!-- Config modal -->
  <div class="modal-bg" id="askModal">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="askModalTitle">Ask agent</span>
        <button class="modal-x" id="askModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Question</label>
          <textarea class="form-textarea" id="askModalInput" rows="4" placeholder="Ask this agent something on its own. Nobody else is consulted."></textarea>
          <div class="form-hint">Only this agent answers. The question and its reply are added to this chat.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="askModalCancel">Cancel</button>
        <button class="btn btn-primary" id="askModalSend">Ask</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toasts"></div>

  <!-- Scripts -->
  <script type="module" src="ui/js/app.js?v=512"></script>
</body>
</html>
